# Local thesis/NIW observability demo only, not production.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "gateway"
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: "ingester"
    static_configs:
      - targets: ["host.docker.internal:8081"]
