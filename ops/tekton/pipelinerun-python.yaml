# Thesis/NIW CI scaffolding examples; not production pipelines
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: python-gateway-ci-run
spec:
  pipelineRef:
    name: python-gateway-ci
  params:
    - name: repo-url
      value: https://github.com/sujon2100/infra-steward-gateway
    - name: revision
      value: main
  workspaces:
    - name: shared-workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi