# Scaffolding for thesis/NIW GitOps examples; not production hardening
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infra-gateway
  namespace: infra-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infra-gateway
  template:
    metadata:
      labels:
        app: infra-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: infra-gateway
        image: ghcr.io/yourorg/infra-gateway:dev
        ports:
        - containerPort: 8000
        env:
        - name: ENVIRONMENT
          value: "development"
        - name: LOG_LEVEL
          value: "INFO"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: infra-gateway-svc
  namespace: infra-gateway
spec:
  type: ClusterIP
  selector:
    app: infra-gateway
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
