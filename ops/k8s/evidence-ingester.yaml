# Scaffolding for thesis/NIW GitOps examples; not production hardening
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infra-evidence-ingester
  namespace: infra-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infra-evidence-ingester
  template:
    metadata:
      labels:
        app: infra-evidence-ingester
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: infra-evidence-ingester
        image: ghcr.io/yourorg/infra-evidence-ingester:dev
        ports:
        - containerPort: 8081
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: infra-evidence-ingester-svc
  namespace: infra-gateway
spec:
  type: ClusterIP
  selector:
    app: infra-evidence-ingester
  ports:
  - protocol: TCP
    port: 8081
    targetPort: 8081
